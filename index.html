<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 10 Ruby - Classmates</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#fff0f6;
            font-family:Arial, sans-serif;
        }

        .navbar{
            background:#ff69b4 !important;
        }

        .title{
            color:#d63384;
            font-weight:bold;
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .student-card{
            background:white;
            border-left:6px solid hotpink;
            transition:.2s;
        }

        .student-card:hover{
            transform:translateY(-3px);
        }

        .subject{
            color:#6f42c1;
            font-weight:bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">✨ Grade 10 Ruby</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Classmates</a>
            <a class="nav-link" href="attendance.html">Attendance</a>
            <a class="nav-link" href="photos.html">Photos</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h1 class="text-center title mb-4">Classmate List</h1>

    <div class="row g-3">

        <script>
            const classmates = [
                ["Abaca","Sci"],
                ["Alavado","Math"],
                ["Arenal","Music & SS"],
                ["Aventajado","Music & SS"],
                ["Buhain","Art"],
                ["Carpio","SS"],
                ["Cenon","Snacktime"],
                ["Cruz","TLE"],
                ["De Leon","PE"],
                ["De Peralta","SS"],
                ["Del Barrio","English"],
                ["Dida-Agun","Math"],
                ["Dumlao","Math"],
                ["Estapia","TLE"],
                ["Galope","SS"],
                ["Galura","TLE"],
                ["Guevarra","PE"],
                ["Gurango","English"],
                ["Lazo","SS"],
                ["Liwag","SS & PE"],
                ["Magpantay","English & Science"],
                ["Moyaen","Music"],
                ["Panuncialman","Math"],
                ["Prowel","SS"],
                ["Ramos","PE"],
                ["Sannino","SS"],
                ["Tecson","Dismissal"],
                ["Ulit","PE & SS"]
            ];

            document.write(
                classmates.map(student => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card student-card p-3 h-100">
                            <h5>${student[0]}</h5>
                            <p class="subject mb-0">Favorite Subject: ${student[1]}</p>
                        </div>
                    </div>
                `).join("")
            );
        </script>

    </div>
</div>

</body>
</html>
